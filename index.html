<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KGA - 3D Knowledge Graph</title>
</head>

<body>
  <div id="app"></div>
  <div id="app2d" style="display:none"></div>
  <button id="dim-toggle" title="Passa 2D/3D">2D</button>


  <div id="breadcrumb"></div>

  <div id="info-panel" class="hidden">
    <button id="close-btn">✕</button>
    <h2 id="node-title">Titolo</h2>
    <p id="node-description">…</p>
    <div id="node-links">
      <h3>Collegamenti</h3>
      <div id="node-links-list"></div>
    </div>
  </div>


  <div id="cmdbar">
    <ul id="cmd-list"></ul>
    <span id="cmd-prompt">&gt;</span>
    <div id="cmd-field">
      <div id="cmd-ghost"></div>
      <input id="cmd-input" type="text" spellcheck="false" autocomplete="off"
        placeholder="aggiungi un concetto… (/ per i comandi, TAB completa)" />
    </div>
    <div id="cmd-hint"></div>
  </div>


  <input id="mp-seek" type="range" min="0" max="100" value="0" />
  <div class="mp-row mp-controls">
    <button id="mp-play">⏯</button>
    <button id="mp-next">⏭</button>
    <input id="mp-vol" type="range" min="0" max="100" value="60" />
    <button id="mp-fav">★</button>
  </div>


  <script type="module" src="/src/main.ts"></script>
</body>

</html>
